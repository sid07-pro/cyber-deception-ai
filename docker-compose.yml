services:
  backend:
    build: ./backend
    container_name: cda-backend
    ports:
      - "8000:8000"
    environment:
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
    volumes:
      - ./backend:/app
      - /app/.venv

  frontend:
    build: ./frontend
    container_name: cda-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: ""
      VITE_PROXY_TARGET: "http://backend:8000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
